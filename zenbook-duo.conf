# Configuración de los scripts zenbook-*
#
# Se instala en /etc/zenbook-duo.conf (install.sh no lo sobrescribe si ya existe).
# Es un archivo bash: solo asignaciones VARIABLE="valor".
# Todo es opcional; lo que no definas usa el valor por defecto de cada script.
# Debe pertenecer a root: zenbook-keyboard-backlight corre como root vía sudo y lo lee.

# ── Pantallas ────────────────────────────────────────────────────────────────
# Nombres de conector según `gdctl show`
MONITOR_UPPER="eDP-1"        # pantalla superior
MONITOR_LOWER="eDP-2"      # pantalla inferior

# Backlights en /sys/class/backlight/ (ver `ls /sys/class/backlight`).
# El de eDP-2 depende del número de tarjeta DRM (card0, card1...).
BACKLIGHT_UPPER="/sys/class/backlight/intel_backlight"
BACKLIGHT_LOWER="/sys/class/backlight/card1-eDP-2-backlight"

# Paso de brillo (% del máximo) por pulsación de F5/F6 y mínimo permitido (valor crudo)
BRIGHTNESS_STEP=5
BRIGHTNESS_MIN=4

# ── Teclado ──────────────────────────────────────────────────────────────────
# Texto que identifica al teclado en /sys/class/hidraw/*/device/uevent
KB_NAME="Zenbook Duo"
# Vendor:Product del teclado por USB (ver `lsusb`)
KB_USB_ID="0b05:1b2c"
# Archivo donde se guarda el nivel de luz (0-3).
KB_STATE_FILE="/tmp/kb-backlight-level"
# Segundos que zenbook-keyboard-monitor espera tras un evento udev del teclado antes de decidir si está
# por USB, BT o desconectado (agrupa la ráfaga de eventos de un solo enchufe). Menos = más rápido.
KB_EVENT_DELAY=0.3

# ── Bluetooth ────────────────────────────────────────────────────────────────
# Segundos de escaneo al buscar el teclado BT que aún no está emparejado
BT_SCAN_SECONDS=15
# Patrón (grep -i) del nombre del teclado en bluetoothctl
BT_KB_PATTERN="zenbook duo keyboard\|ASUS Keyboard"

# ── Touchscreens ─────────────────────────────────────────────────────────────
# Nombre xinput y ID USB (vendor:product, minúsculas) de cada touchscreen.
# Ver `xinput list` y `libinput list-devices`.
TOUCH_UPPER_NAME="ELAN9008:00 04F3:425B"
TOUCH_UPPER_ID="04f3:425b"
TOUCH_LOWER_NAME="ELAN9009:00 04F3:425A"
TOUCH_LOWER_ID="04f3:425a"
# EDID de los paneles (vendor, producto) para gsettings. Ver `gdctl show`.
PANEL_VENDOR="SDC"
PANEL_PRODUCT="419d"
# Serial que lleva el EDID personalizado de eDP-2 (edid/edp2.bin)
PANEL_LOWER_SERIAL="eDP-2"
